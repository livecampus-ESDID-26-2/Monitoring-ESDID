# Pipeline de test (cahier §7.2 adapté Docker)
# stdin du cahier = interactif uniquement → voir examples/test.stdin.conf.example
# heartbeat garde le service actif (équivalent systemctl running)

input {
  heartbeat {
    interval => 60
    message => "hello-elk-tp"
  }
}

filter {
  mutate {
    add_field => { "source" => "test-tp" }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "logstash-test"
  }
  stdout { codec => rubydebug }
}
